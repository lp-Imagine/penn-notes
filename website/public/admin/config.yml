# Decap CMS — https://penn-notes.draftly.cn/admin/
# 手写笔记（勿填 source: ai-article）；保存后 push master → CI 部署

locale: zh_Hans

backend:
  name: github
  repo: lp-Imagine/penn-notes
  branch: master
  base_url: https://penn-notes.draftly.cn
  auth_endpoint: api/decap-auth
  commit_messages:
    create: 'content: create {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload media "{{path}}"'
    deleteMedia: 'content: delete media "{{path}}"'

# 本地联调可临时打开（需 npx decap-server）：
# local_backend: true

# 媒体库：绝对路径（仓库根）避免落到栏目目录旁；CI ingest 有 COS_* 时会收口到 CDN
media_folder: /website/public/uploads
public_folder: /uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: web
    label: JS & 框架
    label_singular: JS & 框架
    folder: website/web
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    path: "{{group}}/{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: Section, name: section, widget: hidden, default: web }
      - {
          label: 日期,
          name: date,
          widget: datetime,
          format: YYYY-MM-DD,
          date_format: YYYY-MM-DD,
          time_format: false,
        }
      - {
          label: 分组,
          name: group,
          widget: select,
          options:
            [
              { label: JavaScript, value: javascript },
              { label: Vue, value: vue },
              { label: React, value: react },
              { label: UI 组件, value: ui-lib },
              { label: 其它, value: misc },
            ],
        }
      - { label: 标签, name: tags, widget: list, required: false, default: [] }
      - { label: 一句话摘要, name: summary, widget: text, required: false }
      - {
          label: 封面,
          name: cover,
          widget: image,
          required: false,
          choose_url: true,
          allow_multiple: false,
          media_library: { config: { max_file_size: 2500000 } },
          hint: "点「选择图片」上传本地图，或「从 URL 插入」贴外链；发布后会自动收口到 COS",
        }
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - {
          label: 正文,
          name: body,
          widget: richtext,
          hint: "可视化编辑；若遇到格式异常可切到「Markdown」源码模式",
        }

