name: CI

on:
  push:
    branches:
      - master
      - main
  repository_dispatch:
    types: [blog-sync]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  # Keep in-flight deploy; canceling mid-upload leaves a half-synced site.
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  # ai-article 同步会先 push 封面/正文，再发 repository_dispatch；跳过中间 push，只保留 dispatch 触发部署
  test:
    if: |
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'blog-sync:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  # Pages 与宝塔并行：海外 SSH 再慢也不挡备份站更新
  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (GitHub Pages backup)
        env:
          PENN_BASE: /penn-notes/
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit_info=$(git describe --all --always --long)
          user_name=$(git log -1 --pretty=format:'%an')
          user_email=$(git log -1 --pretty=format:'%ae')
          deploy_branch=gh-pages
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd website/.vitepress/dist
          # Prevent Jekyll from filtering VitePress assets on github.io
          touch .nojekyll
          git config --global init.defaultBranch "$deploy_branch"
          git init
          git config user.name "$user_name"
          git config user.email "$user_email"
          git add -A
          git commit -m "auto deploy, $commit_info"
          git remote add origin "$repo_url"
          git push origin "HEAD:$deploy_branch" --force
          echo "Deployed. CSS should be under /penn-notes/assets/"
          ls assets/style*.css | head -n 3

  # 主站：在宝塔机 Self-hosted Runner 上构建并本地 rsync（避开海外 SCP）
  deploy-baota:
    needs: test
    runs-on: [self-hosted, baota]
    # systemd 跑 runner 时往往不带 HOME，git --global 会直接失败
    env:
      HOME: /root
    steps:
      # 不用 actions/checkout：直连 github.com 易挂死，且无进度。显式走镜像并 --progress。
      - name: Checkout (CN mirror)
        run: |
          set -euo pipefail
          MIRROR_BASE="${GIT_MIRROR_BASE:-https://ghfast.top/https://github.com}"
          REPO_URL="${MIRROR_BASE}/${GITHUB_REPOSITORY}.git"
          WORK="${GITHUB_WORKSPACE}"
          echo "ci-checkout: cloning $REPO_URL @ $GITHUB_SHA"
          # 默认 cwd 就是 WORK；先离开再删，否则 git 报 Unable to read cwd
          cd /tmp
          rm -rf "$WORK"
          mkdir -p "$WORK"
          # 浅克隆当前提交；含 public/news 配图时可能要数分钟～十几分钟，看进度别急着杀
          git clone --progress --depth 1 --branch "${GITHUB_REF_NAME}" \
            "$REPO_URL" "$WORK" \
            || git clone --progress --depth 50 "$REPO_URL" "$WORK"
          cd "$WORK"
          git fetch --progress --depth 1 origin "$GITHUB_SHA" || true
          git checkout --force "$GITHUB_SHA"
          echo "ci-checkout: ok $(git rev-parse --short HEAD)"
          du -sh . | awk '{print "ci-checkout: worktree "$1}'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
        env:
          # 加速 Node 发行版下载（setup-node）
          NODE_DIST_URL: https://npmmirror.com/mirrors/node

      - name: Install
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci

      - name: Build (origin)
        env:
          PENN_BASE: /
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Deploy to Baota (local)
        env:
          DEPLOY_MODE: local
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash scripts/ci-rsync-dist.sh

      # 部署后推送给百度（需仓库 Secret: BAIDU_PUSH_TOKEN）；失败不阻断部署
      - name: Baidu push (site)
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          BAIDU_SITE: https://penn-notes.draftly.cn
        run: npm run baidu:push -- --mode=site --soft
